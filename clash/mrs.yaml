    url: "https://raw.githubusercontent.com/inkzuji/Rules/main/clash/mrs/Proxy-extra.list"
    interval: 86400
  Bilibili:
    type: "http"
    behavior: "domain"
    format: "mrs"
    path: "./mrs/Bilibili.mrs"
    url: "https://raw.githubusercontent.com/inkzuji/Rules/main/clash/mrs/Bilibili.mrs"
