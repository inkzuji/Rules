# 合并到已有主配置；策略组名称须与主配置一致。
rule-providers:
  AI:
    type: "http"
    behavior: "domain"
    format: "mrs"
    path: "./mrs/AI.mrs"
    url: "https://raw.githubusercontent.com/inkzuji/Rules/main/clash/mrs/AI.mrs"
    interval: 86400
  AI-ip:
    type: "http"
    behavior: "ipcidr"
    format: "mrs"
    path: "./mrs/AI-ip.mrs"
    url: "https://raw.githubusercontent.com/inkzuji/Rules/main/clash/mrs/AI-ip.mrs"
    interval: 86400
  AI-extra:
    type: "http"
    behavior: "classical"
    format: "text"
    path: "./mrs/AI-extra.list"
    url: "https://raw.githubusercontent.com/inkzuji/Rules/main/clash/mrs/AI-extra.list"
    interval: 86400
  Apple:
    type: "http"
    behavior: "domain"
