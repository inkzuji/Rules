rules:
  - "RULE-SET,AI,🤖️AI"
  - "RULE-SET,AI-ip,🤖️AI,no-resolve"
  - "RULE-SET,AI-extra,🤖️AI"
  - "RULE-SET,Apple,🍎苹果"
  - "RULE-SET,Apple-ip,🍎苹果,no-resolve"
  - "RULE-SET,Apple-extra,🍎苹果"
  - "RULE-SET,Game,🎮游戏"
  - "RULE-SET,Game-extra,🎮游戏"
  - "RULE-SET,Proxy,🚀节点选择"
  - "RULE-SET,Proxy-ip,🚀节点选择,no-resolve"
  - "RULE-SET,Proxy-extra,🚀节点选择"
  - "RULE-SET,Bilibili,📽哔哩"
  - "RULE-SET,Bilibili-ip,📽哔哩,no-resolve"
  - "RULE-SET,Bilibili-extra,📽哔哩"
  - "RULE-SET,Direct,DIRECT"
  - "RULE-SET,Direct-extra,DIRECT"
  - "MATCH,🐠 Final"
